<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo Flappy Bird</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="btnEnviar" class="btn-enviar" onclick="abrirSelecaoFases()">Jogar</button>

  <div id="faseMenu" class="fase-menu">
    <h2 class="fase-title">Escolha a Fase</h2>
    <div class="fase-buttons">
      <button id="btnFase1" class="btn-fase" onclick="iniciarJogo(1)">Fase 1</button>
      <button id="btnFase2" class="btn-fase btn-bloqueado" onclick="iniciarJogo(2)" disabled>
        Fase 2 🔒
      </button>
    </div>

    <div class="volume-container">
      <label for="volumeSliderMenu">🔊 Volume da Música</label>
      <input type="range" id="volumeSliderMenu" min="0" max="1" step="0.05" value="0.3" oninput="alterarVolume(this.value)">
    </div>

    <button class="btn-voltar-menu" onclick="voltarParaMenuInicial()">Voltar</button>
  </div>

  <div id="gameContainer" class="game-container">
    <canvas id="flappyCanvas"></canvas>

    <div id="pauseMenu" class="pause-menu">
      <h2 class="pause-title">Jogo Pausado</h2>
      
      <button class="btn-menu btn-continuar" onclick="continuarJogo()">Continuar</button>
      
      <div class="volume-container">
        <label for="volumeSliderPause">🔊 Volume da Música</label>
        <input type="range" id="volumeSliderPause" min="0" max="1" step="0.05" value="0.3" oninput="alterarVolume(this.value)">
      </div>

      <button class="btn-menu btn-voltar-inicio" onclick="voltarParaInicio()">Voltar ao Início</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
